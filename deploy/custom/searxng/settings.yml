# Minimal private-backend override. Unspecified settings and engines come from
# the pinned SearXNG image, avoiding drift from vendoring a full settings snapshot.
use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "SearXNG"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

valkey:
  url: "valkey://valkey:6379/0"

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
